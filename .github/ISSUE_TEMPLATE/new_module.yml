name: New module or skill area
description: Suggest a task area Sole should cover.
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: The task
      description: What do you want Claude to do better? Give 2-3 real example requests.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today
      description: How does Claude handle it now, with or without Sole?
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Existing skills or sources
      description: Open-source skills or guides this could build on, with their licenses.
