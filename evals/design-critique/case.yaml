schema_version: "1.1"
name: design-critique
description: A "critique this page" request loads the design commands and craft floor and names the planted AI tells without editing.
tags: [routing, build, design]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 12
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: |
    Critique the design of index.html. Don't change anything, just tell me the top problems and how to fix them.
graders:
  - type: tool_used
    name: read-commands
    tool: Read
    input_match: 'commands\.md|craft-floor\.md'
    min: 1
    arm: with-only
  - type: llm
    name: names-planted-tells
    criteria: |
      The page was seeded with these AI-default tells: purple/indigo gradient text in the hero, an ALL-CAPS eyebrow label above
      every heading, three identical icon+heading+text feature cards, 01/02/03 numbering on non-sequential content, Inter as the only
      font, and a glassmorphism card. PASS if the critique names at least four of these specifically (with where they are) and gives a
      concrete fix for each. FAIL otherwise.
