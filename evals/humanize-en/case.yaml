schema_version: "1.1"
name: humanize-en
description: English AI-sounding marketing text is rewritten with the humanize module; facts kept, nothing invented, no change notes.
tags: [routing, write, english]
runs: 1
execution:
  max_turns: 8
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: |
    This reads like ChatGPT wrote it. Rewrite it so it sounds like a person wrote it:

    "In today's fast-paced digital landscape, effective time management plays a pivotal role in every agency's success. Founded in 2021 in Leeds, Tallyhour isn't just a time tracker — it's a game-changer for small agencies. It seamlessly integrates with Slack and Google Calendar, empowering teams to unlock their full potential. With plans starting at £6 per user per month, it's no wonder countless agencies have made it an indispensable part of their workflow. In conclusion, Tallyhour truly elevates the way you work."
graders:
  - type: tool_used
    name: read-humanize
    tool: Read
    input_match: 'humanize-text\.md'
    min: 1
    arm: with-only
  - type: regex
    name: tells-removed
    pattern: "fast-paced|digital landscape|pivotal|game-changer|seamless|empower|unlock|elevate|in conclusion|isn't just"
    flags: i
    match: not_contains
  - type: regex
    name: year-and-city-kept
    pattern: "2021[\\s\\S]*Leeds|Leeds[\\s\\S]*2021"
  - type: regex
    name: integrations-kept
    pattern: "Slack[\\s\\S]*Google Calendar|Google Calendar[\\s\\S]*Slack"
  - type: regex
    name: price-kept
    pattern: "£6"
  - type: llm
    name: natural-english
    criteria: |
      The source text (you cannot see it) says: Tallyhour is a time tracker for small agencies, founded in 2021 in Leeds; it
      integrates with Slack and Google Calendar; plans start at £6 per user per month. It also claims, with no evidence, that
      "countless agencies have made it an indispensable part of their workflow", and it is padded with filler ("in today's
      fast-paced digital landscape", "game-changer", "unlock their full potential", "in conclusion... elevates").
      PASS if the reply is plain, natural English that keeps every fact above and adds no fact that is not in the source
      (no new features, numbers, customer counts, testimonials, free trial, discount or call to action such as "Try it free").
      The unsupported "countless agencies" claim may be dropped or kept as it is, but must not be replaced by a new, more
      specific claim. The reply must be the rewritten text only: a one-line lead-in is fine, but a list or explanation of what
      was changed is FAIL. Using em dashes as the main connector (more than one) is FAIL. FAIL otherwise.
