schema_version: "1.1"
name: deslop-code
description: AI-looking Python (narrating comments, a factory for one call, swallowed exceptions, emoji prints) is cleaned up to match the repo while keeping behaviour.
tags: [routing, build, code]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 14
  allowed_tools: [Skill, Read, Glob, Grep, Edit, Write]
  prompt: |
    billing.py looks like an AI wrote it. Clean it up so it reads like the rest of this repo. test_billing.py describes the behaviour we want.
graders:
  - type: tool_used
    name: read-deslop-code
    tool: Read
    input_match: 'deslop-code\.md'
    min: 1
    arm: with-only
  - type: regex
    name: tells-gone
    target: { source: file, path: billing.py }
    pattern: "Factory|✅|❌|# Initialize|# Loop through|Updated to use|except Exception|print\\("
    match: not_contains
  - type: regex
    name: public-function-kept
    target: { source: file, path: billing.py }
    pattern: "def calculate_invoice_total\\("
  - type: llm
    name: same-behaviour-cleaner-code
    focus: { source: file, path: billing.py }
    criteria: |
      This is the cleaned-up billing.py. The original computed, for each item, Decimal(str(item["price"])) * item["qty"],
      added VAT from tax.vat_for(line, item.get("vat", "standard")), and summed the lines into a Decimal. The repo's own
      style (tax.py) is plain functions, type hints, no comments, and it raises ValueError for an unknown VAT rate. The test
      file expects calculate_invoice_total(items) to return Decimal("29.00") for two items at 10.00 (qty 2, standard VAT)
      and one at 5.00 (zero VAT), and to raise ValueError for an unknown rate.
      PASS if the file keeps calculate_invoice_total with that exact calculation (same Decimal conversion, same default
      "standard" rate, VAT via vat_for, no added rounding), lets the ValueError propagate (no broad try/except, no print),
      has no factory or class layer around a single function, no comments that narrate the code and no template docstrings
      that only restate the signature, and uses domain names (such as items, line, net, total) rather than data/result. FAIL otherwise.
