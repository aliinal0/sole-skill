schema_version: "1.1"
name: cro-funnel
description: 'A funnel question gets correct step rates, a data-backed first target, and an honest warning that 30 paid conversions a month is too few for a classic A/B test.'
tags: [routing, business, cro]
runs: 1
execution:
  max_turns: 10
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: |
    Last month our SaaS signup funnel was: 40,000 landing visits -> 2,400 started signup -> 600 finished signup -> 150 activated (created a first project) -> 30 became paying. What should we A/B test first?
graders:
  - type: tool_used
    name: read-module
    tool: Read
    input_match: 'cro-analytics\.md'
    min: 1
    arm: with-only
  - type: llm
    name: quality
    criteria: |
      The funnel: 40,000 visits -> 2,400 started signup (6%) -> 600 finished (25% of starters) -> 150 activated (25%)
      -> 30 paid (20% of activated). Only 30 paid conversions a month.
      PASS if the reply (a) gets the step rates right (any wrong rate is FAIL); (b) picks a first target and justifies it
      from the numbers; (c) says plainly that 30 paid conversions a month is far too few for a classic A/B test on paid
      conversion, and adapts (test a higher-volume step such as signup start or completion, make bold changes, add
      qualitative research such as recordings, surveys or interviews); (d) states a hypothesis with the metric it should move
      and says to fix sample size or duration before starting. FAIL otherwise.
