schema_version: "1.1"
name: cmd-brief
description: The brief slash command loads its module and does the job.
tags: [command]
runs: 1
execution:
  max_turns: 14
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: |
    /sole:brief a website for my dog-walking business in Bath
graders:
  - type: tool_used
    name: read-module
    tool: Read
    input_match: 'intent\.md'
    min: 1
    arm: with-only
  - type: llm
    name: quality
    criteria: |
      The user ran a "brief" command for a vague website request. PASS if the reply asks at most 4 questions in total
      (count every question, including "also tell me" lines), each with options or examples and a recommended answer, and does
      not start designing or building the site yet. FAIL if it builds anything, asks more than 4 questions, or asks
      open-ended questions with no recommendation.
