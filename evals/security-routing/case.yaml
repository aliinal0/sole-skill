schema_version: "1.1"
name: security-routing
description: A security review request loads the security module and finds the planted SQL injection and missing ownership check, with file:line evidence.
tags: [routing, build, security]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 14
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: |
    Can you do a quick security review of app.py before I deploy it? Just tell me what is wrong, don't change anything.
graders:
  - type: tool_used
    name: read-security-module
    tool: Read
    input_match: 'security-audit\.md'
    min: 1
    arm: with-only
  - type: regex
    name: finds-sql-injection
    pattern: 'SQL injection|SQLi|injection'
    flags: i
  - type: regex
    name: finds-idor
    pattern: 'IDOR|BOLA|object-level|owner_id|ownership|any invoice|another user|other users|access control|authori[sz]ation'
    flags: i
  - type: llm
    name: evidence-and-fix
    criteria: |
      PASS if the review (a) identifies the SQL injection in the search endpoint and the missing ownership check on the invoice
      endpoint, (b) cites file and line or function names as evidence, (c) gives a concrete smallest fix for each (parameterized query;
      check invoice.owner_id == current user), and (d) does not pad the answer with generic best-practice items presented as vulnerabilities. FAIL otherwise.
