schema_version: "1.1"
name: memory-resume
description: With a .sole/CONTEXT.md in the project, a "continue" request resumes from Next and respects Preferences without re-exploring.
tags: [memory, core]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 6
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: |
    Where were we? What is the next thing to do? Answer briefly.
graders:
  - type: regex
    name: mentions-next-step
    pattern: "pricing"
    flags: i
  - type: llm
    name: resumes-correctly
    criteria: |
      PASS if the answer says the next step is the pricing page for the coffee roaster site, does not propose redoing the
      already-finished homepage, and is three sentences or fewer (the stored preference). FAIL otherwise.
