schema_version: "1.1"
name: ui-routing
description: A UI request loads the deslop-ui module and no business modules, and the plan avoids default AI aesthetics.
tags: [routing, build]
runs: 1
execution:
  max_turns: 12
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: |
    I want a landing page for a small specialty coffee roaster in Bristol, UK. They sell single-origin beans online and run cupping workshops on weekends.
    Do not write code yet. Give me only the design plan: palette, typography, layout concept and the one signature idea.
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    min: 1
    arm: with-only
  - type: tool_used
    name: read-deslop-ui
    tool: Read
    input_match: 'deslop-ui\.md'
    min: 1
    arm: with-only
  - type: tool_used
    name: no-business-modules
    tool: Read
    input_match: 'business[\\/]+'
    min: 0
    max: 0
    arm: with-only
  - type: llm
    name: distinctive-plan
    criteria: |
      Score PASS if the design plan (a) names specific colours (hex or OKLCH) and named typefaces that are not Inter/Roboto/Arial/system-ui
      as the primary face, (b) grounds choices in the coffee/roastery/Bristol subject (materials, place, process), (c) names one signature idea,
      and (d) does not default to a purple/indigo gradient or a generic hero + three feature cards structure. Otherwise FAIL.
